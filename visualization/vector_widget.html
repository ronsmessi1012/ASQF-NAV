<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Vector</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f7f7f8;
        }

        .container {
            width: 850px;
            max-width: 95vw;

            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 5px 0;

            font-size: 25px;
            font-weight: 650;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        canvas {
            width: 100%;
            height: auto;

            display: block;

            border-radius: 12px;

            background: white;

            cursor: crosshair;
        }

        .values {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-top: 20px;
        }

        .card {
            background: #f5f5f7;

            border-radius: 12px;

            padding: 14px;

            text-align: center;
        }

        .label {
            font-size: 13px;
            color: #777;

            margin-bottom: 5px;
        }

        .value {
            font-size: 20px;
            font-weight: 600;
        }

        .hint {
            text-align: center;

            margin-top: 16px;

            color: #777;

            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Interactive Vector</h1>

    <div class="subtitle">
        Drag the arrowhead to change the vector
    </div>

    <canvas
        id="canvas"
        width="800"
        height="500">
    </canvas>

    <div class="values">

        <div class="card">

            <div class="label">
                X Component
            </div>

            <div
                class="value"
                id="xValue">
                0
            </div>

        </div>

        <div class="card">

            <div class="label">
                Y Component
            </div>

            <div
                class="value"
                id="yValue">
                0
            </div>

        </div>

        <div class="card">

            <div class="label">
                Magnitude
            </div>

            <div
                class="value"
                id="magnitudeValue">
                0
            </div>

        </div>

    </div>

    <div class="hint">
        Drag the blue endpoint anywhere on the coordinate plane
    </div>

</div>


<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/*
==========================================================
COORDINATE SYSTEM
==========================================================
*/

const origin = {

    x: canvas.width / 2,

    y: canvas.height / 2

};


/*
==========================================================
VECTOR
==========================================================
*/

let vector = {

    x: 150,

    y: -100

};


/*
==========================================================
DRAGGING STATE
==========================================================
*/

let dragging = false;


/*
==========================================================
DRAW GRID
==========================================================
*/

function drawGrid() {

    ctx.lineWidth = 1;

    ctx.strokeStyle = "#eeeeee";

    const spacing = 25;


    /*
    Vertical lines
    */

    for (
        let x = 0;
        x <= canvas.width;
        x += spacing
    ) {

        ctx.beginPath();

        ctx.moveTo(x, 0);

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();

    }


    /*
    Horizontal lines
    */

    for (
        let y = 0;
        y <= canvas.height;
        y += spacing
    ) {

        ctx.beginPath();

        ctx.moveTo(0, y);

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();

    }

}


/*
==========================================================
DRAW AXES
==========================================================
*/

function drawAxes() {

    ctx.strokeStyle = "#555";

    ctx.lineWidth = 2;


    /*
    X axis
    */

    ctx.beginPath();

    ctx.moveTo(
        0,
        origin.y
    );

    ctx.lineTo(
        canvas.width,
        origin.y
    );

    ctx.stroke();


    /*
    Y axis
    */

    ctx.beginPath();

    ctx.moveTo(
        origin.x,
        0
    );

    ctx.lineTo(
        origin.x,
        canvas.height
    );

    ctx.stroke();

}


/*
==========================================================
DRAW ARROW
==========================================================
*/

function drawArrow() {

    const endX =
        origin.x + vector.x;

    const endY =
        origin.y + vector.y;


    /*
    Vector line
    */

    ctx.strokeStyle = "#2563eb";

    ctx.lineWidth = 5;

    ctx.lineCap = "round";

    ctx.beginPath();

    ctx.moveTo(
        origin.x,
        origin.y
    );

    ctx.lineTo(
        endX,
        endY
    );

    ctx.stroke();


    /*
    Arrow head
    */

    const angle =
        Math.atan2(
            endY - origin.y,
            endX - origin.x
        );

    const arrowLength = 18;

    const arrowAngle =
        Math.PI / 7;


    ctx.fillStyle = "#2563eb";

    ctx.beginPath();

    ctx.moveTo(
        endX,
        endY
    );

    ctx.lineTo(
        endX -
        arrowLength *
        Math.cos(
            angle - arrowAngle
        ),

        endY -
        arrowLength *
        Math.sin(
            angle - arrowAngle
        )
    );

    ctx.lineTo(
        endX -
        arrowLength *
        Math.cos(
            angle + arrowAngle
        ),

        endY -
        arrowLength *
        Math.sin(
            angle + arrowAngle
        )
    );

    ctx.closePath();

    ctx.fill();


    /*
    Draggable endpoint
    */

    ctx.beginPath();

    ctx.arc(
        endX,
        endY,
        11,
        0,
        2 * Math.PI
    );

    ctx.fill();


    /*
    Center point
    */

    ctx.fillStyle = "#111";

    ctx.beginPath();

    ctx.arc(
        origin.x,
        origin.y,
        5,
        0,
        2 * Math.PI
    );

    ctx.fill();

}


/*
==========================================================
UPDATE NUMBERS
==========================================================
*/

function updateValues() {

    const x = vector.x;

    /*
    Canvas Y is inverted.
    Therefore mathematical Y is -vector.y.
    */

    const y = -vector.y;


    const magnitude =
        Math.sqrt(
            x * x +
            y * y
        );


    document
        .getElementById("xValue")
        .textContent =
        x.toFixed(2);


    document
        .getElementById("yValue")
        .textContent =
        y.toFixed(2);


    document
        .getElementById("magnitudeValue")
        .textContent =
        magnitude.toFixed(2);

}


/*
==========================================================
RENDER
==========================================================
*/

function render() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawGrid();

    drawAxes();

    drawArrow();

    updateValues();

}


/*
==========================================================
GET MOUSE POSITION
==========================================================
*/

function getMousePosition(event) {

    const rect =
        canvas.getBoundingClientRect();


    /*
    Important:
    Canvas may be visually resized by CSS.
    */

    const scaleX =
        canvas.width /
        rect.width;

    const scaleY =
        canvas.height /
        rect.height;


    return {

        x:
            (event.clientX - rect.left)
            * scaleX,

        y:
            (event.clientY - rect.top)
            * scaleY

    };

}


/*
==========================================================
MOUSE DOWN
==========================================================
*/

canvas.addEventListener(
    "mousedown",

    function(event) {

        const mouse =
            getMousePosition(event);


        const endX =
            origin.x + vector.x;

        const endY =
            origin.y + vector.y;


        const distance =
            Math.sqrt(

                (mouse.x - endX) ** 2 +

                (mouse.y - endY) ** 2

            );


        /*
        Start dragging only if the
        mouse is close to the endpoint.
        */

        if (distance < 25) {

            dragging = true;

            canvas.style.cursor =
                "grabbing";

        }

    }
);


/*
==========================================================
MOUSE MOVE
==========================================================
*/

canvas.addEventListener(
    "mousemove",

    function(event) {

        if (!dragging) {

            return;

        }


        const mouse =
            getMousePosition(event);


        /*
        Convert canvas coordinates
        into mathematical coordinates.
        */

        vector.x =
            mouse.x - origin.x;


        vector.y =
            mouse.y - origin.y;


        render();

    }
);


/*
==========================================================
MOUSE UP
==========================================================
*/

canvas.addEventListener(
    "mouseup",

    function() {

        dragging = false;

        canvas.style.cursor =
            "crosshair";

    }
);


/*
==========================================================
MOUSE LEAVE
==========================================================
*/

canvas.addEventListener(
    "mouseleave",

    function() {

        dragging = false;

        canvas.style.cursor =
            "crosshair";

    }
);


/*
==========================================================
INITIAL RENDER
==========================================================
*/

render();

</script>

</body>
</html>
